# TEMPORARY — proves the self-hosted `arcgis-pro` runner can do what
# release.yml's `build-addin` job needs. Mirrors that job's steps exactly.
# Delete once it has passed.
name: Runner Smoke Test

on:
  workflow_dispatch:

jobs:
  addin-build-smoke:
    name: Smoke — build Add-In on self-hosted runner
    runs-on: [self-hosted, windows, arcgis-pro]
    steps:
      - uses: actions/checkout@v4

      - name: Report runner environment
        shell: pwsh
        run: |
          "runner:      $env:RUNNER_NAME"
          "os:          $((Get-CimInstance Win32_OperatingSystem).Caption)"
          $proBin = 'C:\Program Files\ArcGIS\Pro\bin'
          "Pro bin present: $(Test-Path $proBin)"
          if (Test-Path $proBin) {
            $sdk = Get-ChildItem $proBin -Filter 'ArcGIS.Desktop.Framework.dll' -ErrorAction SilentlyContinue
            "ArcGIS.Desktop.Framework.dll: $([bool]$sdk)"
          }

      - name: Locate MSBuild
        id: msbuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Add-In (Release)
        shell: pwsh
        run: |
          & "${{ steps.msbuild.outputs.msbuildPath }}\MSBuild.exe" `
            AddIn/APBridgeAddIn/APBridgeAddIn.csproj `
            -p:Configuration=Release `
            -restore

      - name: Assert .esriAddinX produced
        shell: pwsh
        run: |
          $b = Get-ChildItem -Path AddIn/APBridgeAddIn/bin/Release -Recurse -Filter *.esriAddinX |
                 Select-Object -First 1
          if (-not $b) { throw "No .esriAddinX produced." }
          "Produced: $($b.FullName) ($($b.Length) bytes)"
